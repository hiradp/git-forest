[package]
name = "git-forest"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Manage named workspaces across multiple Git repositories"
license = "MIT"
repository = "https://github.com/hiradp/git-forest"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
