[package]
name = "git-forest"
version = "0.1.0"
edition = "2024"
description = "Manage named workspaces across multiple Git repositories"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
