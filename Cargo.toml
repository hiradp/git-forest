[package]
name = "git-forest"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Manage named workspaces across multiple Git repositories"
license = "MIT"
repository = "https://github.com/hiradp/git-forest"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
